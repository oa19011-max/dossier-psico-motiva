<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dossier Psico Motiva Challenge</title><style>body{    font-family: Arial, sans-serif;    background: #EAF4FF;    display:flex;    justify-content:center;    align-items:center;    height:100vh;    margin:0;}.container{    text-align:center;    background:white;    padding:40px;    border-radius:20px;    box-shadow:0 5px 20px rgba(0,0,0,0.15);}h1{    color:#0078D4;    margin-bottom:30px;    font-size:40px;}.timer{    font-size:90px;    font-weight:bold;    color:#2C3E50;    margin:20px 0;}button{    padding:15px 25px;    font-size:18px;    margin:10px;    border:none;    border-radius:10px;    cursor:pointer;}.start{    background:#28A745;    color:white;}.reset{    background:#DC3545;    color:white;}.start:hover{    background:#218838;}.reset:hover{    background:#C82333;}</style></head><body><div class="container">    <h1>Dossier Psico Motiva Challenge</h1>    <div id="timer" class="timer">02:00</div>    <button class="start" onclick="startTimer()">Iniciar</button>    <button class="reset" onclick="resetTimer()">Reiniciar</button></div><script>let seconds = 120;let interval;function updateDisplay() {    let mins = Math.floor(seconds / 60);    let secs = seconds % 60;    document.getElementById("timer").innerText =        String(mins).padStart(2,'0') + ":" +        String(secs).padStart(2,'0');}function startTimer() {    clearInterval(interval);    interval = setInterval(() => {        if(seconds <= 0){            clearInterval(interval);            alert("¡Tiempo completado!");            return;        }        seconds--;        updateDisplay();    },1000);}function resetTimer() {    clearInterval(interval);    seconds = 120;    updateDisplay();}updateDisplay();</script></body></html>
